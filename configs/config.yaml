# ============================================================
# "在吗" APP 后端配置 - 开发环境默认
# ============================================================

server:
  port: 8080
  mode: debug  # debug / release / test

database:
  host: localhost
  port: 5432
  user: zaima
  password: zaima_dev_2026
  dbname: zaima
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  secret: "zaima-jwt-secret-change-in-production"
  expire_hours: 720  # 30 天

sms:
  # 短信验证码供应商 (阿里云 / 腾讯云)
  provider: aliyun
  access_key_id: ""
  access_key_secret: ""
  sign_name: "在吗"
  template_code: ""

oss:
  provider: aliyun
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket_name: zaima-media

llm:
  # 大语言模型 (DeepSeek / 通义千问 / 智谱清言)
  provider: deepseek
  api_key: ""
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  timeout_seconds: 10

weather:
  # 和风天气
  api_key: ""
  base_url: "https://devapi.qweather.com/v7"
  cache_ttl_hours: 12

news:
  # 聚合数据
  api_key: ""
  base_url: "https://v.juhe.cn/toutiao/index"
  cache_ttl_hours: 12

stt:
  # 语音转文字 (阿里云一句话识别)
  provider: aliyun
  access_key_id: ""
  access_key_secret: ""
  app_key: ""

push:
  # 极光推送
  app_key: ""
  master_secret: ""
